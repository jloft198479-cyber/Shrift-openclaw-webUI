// ============================================================
//  Rough renderer (inspired by rough.js / Excalidraw)
//  Inline, no dependencies
// ============================================================
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("cvs");
const X = svg.namespaceURI;

// Seeded PRNG (xorshift32)
function rng(seed) {
  let s = seed | 0;
  return function() {
    s ^= s << 13; s ^= s >> 17; s ^= s << 5;
    return ((s < 0 ? ~s + 1 : s) % 0xFFFFFFFF) / 0xFFFFFFFF;
  };
}

// Add element to SVG
function add(el) { svg.appendChild(el); return el; }

// ── Rough rectangle (Excalidraw double-stroke style) ──
function rrect(x, y, w, h, opt = {}) {
  const s = opt.seed || 0;
  const R = opt.rough || 1.5;
  const sw = opt.sw || 2;
  const fill = opt.fill || "#fff";
  const stroke = opt.stroke || "#000";
  const g = document.createElementNS(NS, "g");

  // Generate 4 corner points with small random offsets (two sets for double stroke)
  function corners(x, y, w, h, r) {
    const o = [];
    for (let i = 0; i < 8; i++) o.push((r() - 0.5) * R * 2);
    return [
      [x + o[0], y + o[1]],
      [x + w + o[2], y + o[3]],
      [x + w + o[4], y + h + o[5]],
      [x + o[6], y + h + o[7]],
    ];
  }

  function makePath(corners, r) {
    // Use quadratic bezier to simulate hand-drawn wobbly rectangle
    let d = "";
    for (let i = 0; i < 4; i++) {
      const c = corners[i];
      const n = corners[(i+1)%4];
      const mx = (c[0]+n[0])/2 + (r()-0.5)*R*3;
      const my = (c[1]+n[1])/2 + (r()-0.5)*R*3;
      d += (i===0?"M":"Q") + c[0].toFixed(1) + "," + c[1].toFixed(1)
         + " " + mx.toFixed(1) + "," + my.toFixed(1)
         + " " + n[0].toFixed(1) + "," + n[1].toFixed(1);
    }
    return d + " Z";
  }

  const r1 = rng(s);
  const r2 = rng(s + 137);

  // Fill (subtle, inset)
  const fi = document.createElementNS(NS, "rect");
  fi.setAttribute("x", x+4); fi.setAttribute("y", y+4);
  fi.setAttribute("width", w-8); fi.setAttribute("height", h-8);
  fi.setAttribute("rx", 2); fi.setAttribute("ry", 2);
  fi.setAttribute("fill", fill); fi.setAttribute("opacity", "0.3");
  g.appendChild(fi);

  // Stroke 1
  const p1 = document.createElementNS(NS, "path");
  p1.setAttribute("d", makePath(corners(x,y,w,h,r1), r1));
  p1.setAttribute("fill", "none");
  p1.setAttribute("stroke", stroke);
  p1.setAttribute("stroke-width", sw);
  p1.setAttribute("stroke-linecap", "round");
  p1.setAttribute("stroke-linejoin", "round");
  g.appendChild(p1);

  // Stroke 2 (ghost, slightly different)
  const p2 = document.createElementNS(NS, "path");
  p2.setAttribute("d", makePath(corners(x,y,w,h,r2), r2));
  p2.setAttribute("fill", "none");
  p2.setAttribute("stroke", stroke);
  p2.setAttribute("stroke-width", sw * 0.6);
  p2.setAttribute("stroke-linecap", "round");
  p2.setAttribute("opacity", "0.45");
  g.appendChild(p2);

  return g;
}

// ── Rough line ──
function rline(x1,y1,x2,y2, opt={}) {
  const r = rng(opt.seed||0);
  const R = opt.rough || 1.2;
  const steps = Math.max(3, Math.floor(Math.hypot(x2-x1, y2-y1) / 10));
  let d = `M${x1.toFixed(1)},${y1.toFixed(1)}`;
  for (let i = 1; i <= steps; i++) {
    const t = i/steps;
    const px = x1 + (x2-x1)*t + (r()-0.5)*R*2.5;
    const py = y1 + (y2-y1)*t + (r()-0.5)*R*2.5;
    d += ` L${px.toFixed(1)},${py.toFixed(1)}`;
  }
  const p = document.createElementNS(NS, "path");
  p.setAttribute("d", d);
  p.setAttribute("fill", "none");
  p.setAttribute("stroke", opt.stroke || "#000");
  p.setAttribute("stroke-width", opt.sw || 1.8);
  p.setAttribute("stroke-linecap", "round");
  if (opt.dash) p.setAttribute("stroke-dasharray", opt.dash);
  if (opt.markerEnd) p.setAttribute("marker-end", opt.markerEnd);
  return p;
}

// ── Rough arrow (line + optional label) ──
function rarrow(x1,y1,x2,y2, label, opt={}) {
  const g = document.createElementNS(NS, "g");
  g.appendChild(rline(x1,y1,x2,y2, opt));
  if (label) {
    const lx = (x1+x2)/2 + (opt.ldx||0);
    const ly = (y1+y2)/2 + (opt.ldy||-7);
    const t = document.createElementNS(NS, "text");
    t.setAttribute("x", lx); t.setAttribute("y", ly);
    t.setAttribute("text-anchor", "middle");
    t.setAttribute("font-size", opt.lsize || 9.5);
    t.setAttribute("fill", opt.stroke || "#555");
    t.setAttribute("font-family", "'PingFang SC','Microsoft YaHei',sans-serif");
    t.textContent = label;
    g.appendChild(t);
  }
  return g;
}

// ── Text block ──
function txt(lines, x, y, opt={}) {
  const g = document.createElementNS(NS, "g");
  const size = opt.size || 12;
  const anchor = opt.anchor || "start";
  const font = opt.font || "'PingFang SC','Microsoft YaHei',sans-serif";
  const weight = opt.weight || "normal";
  const fill = opt.fill || "#1a1a2e";
  const r = rng(opt.seed||0);
  (Array.isArray(lines)?lines:[lines]).forEach((line,i) => {
    const t = document.createElementNS(NS, "text");
    const ox = (r()-0.5)*0.7, oy = (r()-0.5)*0.5;
    t.setAttribute("x", x + ox);
    t.setAttribute("y", y + i*(size+3.5) + oy);
    t.setAttribute("font-size", size);
    t.setAttribute("font-family", font);
    t.setAttribute("font-weight", weight);
    t.setAttribute("fill", fill);
    t.setAttribute("font-family", font);
    if (anchor) t.setAttribute("text-anchor", anchor);
    t.textContent = line;
    g.appendChild(t);
  });
  return g;
}

// ── Rough ellipse ──
function rellipse(cx,cy,rx,ry,opt={}) {
  const r = rng(opt.seed||0);
  const R = opt.rough||1.5;
  const g = document.createElementNS(NS,"g");
  // Fill
  const f = document.createElementNS(NS,"ellipse");
  f.setAttribute("cx",cx); f.setAttribute("cy",cy);
  f.setAttribute("rx",rx-2); f.setAttribute("ry",ry-2);
  f.setAttribute("fill",opt.fill||"none");
  f.setAttribute("opacity","0.3");
  g.appendChild(f);
  // Rough outline
  let d = "";
  const N = 28;
  for (let i=0;i<=N;i++) {
    const a = 2*Math.PI*i/N;
    const px = cx + rx*Math.cos(a) + (r()-0.5)*R*2;
    const py = cy + ry*Math.sin(a) + (r()-0.5)*R*2;
    d += (i===0?"M":"L")+px.toFixed(1)+","+py.toFixed(1);
  }
  d += " Z";
  const p = document.createElementNS(NS,"path");
  p.setAttribute("d",d);
  p.setAttribute("fill","none");
  p.setAttribute("stroke",opt.stroke||"#000");
  p.setAttribute("stroke-width",opt.sw||2);
  p.setAttribute("stroke-linecap","round");
  g.appendChild(p);
  return g;
}
