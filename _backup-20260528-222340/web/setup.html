<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>首次配置 - 虾指挥</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif;
  background: #f5f5f0; min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  color: #1c1917; line-height: 1.6;
}
.setup-card {
  background: #fff; border-radius: 16px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.04);
  padding: 40px; max-width: 520px; width: 90%;
}
.setup-card h1 { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
.setup-card .subtitle { color: #78716c; font-size: 14px; margin-bottom: 24px; }
.form-group { margin-bottom: 20px; }
.form-group label {
  display: block; font-size: 13px; font-weight: 500;
  color: #444; margin-bottom: 6px;
}
.form-group .hint {
  font-size: 12px; color: #a8a29e; margin-top: 4px;
  line-height: 1.5;
}
.form-group .hint code {
  background: #f5f5f0; padding: 1px 6px; border-radius: 3px;
  font-size: 11px; color: #78716c;
}
.input-row { display: flex; gap: 8px; }
.input-row input {
  flex: 1; padding: 10px 14px; border: 1px solid #d6d3d1;
  border-radius: 8px; font-size: 14px; outline: none;
  transition: border-color .15s; font-family: inherit;
}
.input-row input:focus { border-color: #c96442; box-shadow: 0 0 0 2px rgba(201,100,66,0.12); }
.input-row input.invalid { border-color: #dc2626; }
.input-row input.valid { border-color: #16a34a; }
.btn-row { display: flex; gap: 8px; margin-top: 12px; }
.btn {
  padding: 10px 18px; border: none; border-radius: 8px;
  font-size: 14px; font-weight: 500; cursor: pointer;
  transition: all .15s; white-space: nowrap;
}
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: #c96442; color: #fff; }
.btn-primary:hover:not(:disabled) { background: #b85734; }
.btn-secondary { background: #f5f5f0; color: #444; }
.btn-secondary:hover:not(:disabled) { background: #e7e5e4; }
.btn-success { background: #16a34a; color: #fff; }
.btn-success:hover:not(:disabled) { background: #15803d; }
.status {
  margin-top: 16px; padding: 12px 14px; border-radius: 8px;
  font-size: 13px; display: none;
}
.status.success { display: block; background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
.status.error { display: block; background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
.status.info { display: block; background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
.status.warn { display: block; background: #fffbeb; color: #92400e; border: 1px solid #fde68a; }
.detecting { display: none; font-size: 13px; color: #78716c; margin-top: 8px; }
.detecting.active { display: block; }
.footer { margin-top: 24px; font-size: 12px; color: #a8a29e; text-align: center; }
.info-grid { margin-top: 16px; padding: 12px; background: #fafaf9; border-radius: 8px; font-size: 12px; display: none; }
.info-grid .row { display: flex; justify-content: space-between; padding: 3px 0; }
.info-grid .row .label { color: #78716c; }
.info-grid .row .value { color: #444; font-weight: 500; }
</style>
</head>
<body>
<div class="setup-card">
  <h1>欢迎使用 虾指挥</h1>
  <p class="subtitle">首次运行需要配置 OpenClaw 的安装位置</p>

  <div class="form-group">
    <label>OpenClaw 配置文件路径</label>
    <div class="input-row">
      <input type="text" id="config-path" placeholder="例如：C:\Users\用户名\AppData\Roaming\openclaw\openclaw.json">
      <button class="btn btn-secondary" onclick="detectConfig()">自动检测</button>
    </div>
    <div class="hint">
      请指向 <code>openclaw.json</code> 文件本身，而非其所在文件夹。<br>
      常见位置：
      • <code>%APPDATA%\openclaw\openclaw.json</code><br>
      • <code>%LOCALAPPDATA%\openclaw\openclaw.json</code><br>
      • <code>~\.openclaw\openclaw.json</code><br>
      • 自定义安装目录下
    </div>
    <div class="detecting" id="detecting">正在检测...</div>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="verifyConfig()">验证路径</button>
    </div>
  </div>

  <div class="info-grid" id="info-grid">
    <div class="row"><span class="label">文件状态</span><span class="value" id="v-status" style="color:#16a34a">有效</span></div>
    <div class="row"><span class="label">Gateway 端口</span><span class="value" id="v-port">-</span></div>
    <div class="row"><span class="label">Token</span><span class="value" id="v-token">-</span></div>
    <div class="row"><span class="label">模型提供商</span><span class="value" id="v-providers">-</span></div>
  </div>

  <div class="status" id="status"></div>

  <div class="btn-row">
    <button class="btn btn-success" id="btn-save" onclick="saveConfig()" disabled>保存配置</button>
  </div>
  <div class="footer">保存后将自动进入主界面</div>
</div>

<script>
var _verifiedInfo = null;

function showStatus(msg, type) {
  var el = document.getElementById('status');
  el.className = 'status ' + type;
  el.textContent = msg;
  el.style.display = 'block';
  el.style.whiteSpace = 'pre-wrap';
}

function hideStatus() {
  var el = document.getElementById('status');
  el.className = 'status';
  el.style.display = 'none';
}

async function detectConfig() {
  var input = document.getElementById('config-path');
  var detecting = document.getElementById('detecting');
  detecting.classList.add('active');
  hideStatus();
  resetVerify();

  try {
    var r = await fetch('/api/setup/detect', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({}) });
    var data = await r.json();
    if (data.found) {
      input.value = data.path;
      showStatus('已自动检测到配置文件！点击"验证路径"确认', 'success');
    } else {
      showStatus('未自动检测到配置文件，请手动输入路径', 'info');
    }
  } catch(e) {
    showStatus('检测失败: ' + e.message, 'error');
  }
  detecting.classList.remove('active');
}

function resetVerify() {
  document.getElementById('info-grid').style.display = 'none';
  document.getElementById('btn-save').disabled = true;
  document.getElementById('config-path').className = '';
  _verifiedInfo = null;
}

async function verifyConfig() {
  var path = document.getElementById('config-path').value.trim();
  var input = document.getElementById('config-path');
  hideStatus();
  resetVerify();

  if (!path) { showStatus('请先输入 OpenClaw 配置文件路径', 'warn'); return; }

  try {
    var r = await fetch('/api/setup/verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: path })
    });
    var data = await r.json();
    if (data.valid) {
      input.className = 'valid';
      _verifiedInfo = data.info;
      var grid = document.getElementById('info-grid');
      document.getElementById('v-status').textContent = '有效 ✓';
      document.getElementById('v-port').textContent = data.info.port || '-';
      document.getElementById('v-token').textContent = data.info.token || '-';
      var providers = data.info.providers || [];
      document.getElementById('v-providers').textContent = providers.length > 0 ? providers.join(', ') : '-';
      grid.style.display = 'block';
      document.getElementById('btn-save').disabled = false;
      showStatus('路径验证通过！可点击"保存配置"', 'success');
    } else {
      input.className = 'invalid';
      showStatus(data.error || '路径无效', 'error');
    }
  } catch(e) {
    input.className = 'invalid';
    showStatus('验证失败: ' + e.message, 'error');
  }
}

async function saveConfig() {
  var path = document.getElementById('config-path').value.trim();
  if (!path) { showStatus('请输入 OpenClaw 配置文件路径', 'error'); return; }

  document.getElementById('btn-save').disabled = true;
  document.getElementById('btn-save').textContent = '保存中…';

  try {
    var r = await fetch('/api/setup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ openclawConfigPath: path })
    });
    var data = await r.json();
    if (data.success) {
      showStatus('配置完成！正在加载主界面…', 'success');
      setTimeout(function () {
        window.location.href = '/';
      }, 1500);
    } else {
      showStatus(data.error || '保存失败', 'error');
      document.getElementById('btn-save').disabled = false;
      document.getElementById('btn-save').textContent = '保存配置';
    }
  } catch(e) {
    showStatus('保存失败: ' + e.message, 'error');
    document.getElementById('btn-save').disabled = false;
    document.getElementById('btn-save').textContent = '保存配置';
  }
}
</script>
</body>
</html>
